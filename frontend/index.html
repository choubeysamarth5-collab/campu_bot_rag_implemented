<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot – Your College Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/web-ui.css" />
  <script src="js/web-ui.js" defer></script>
  <script src="auth/auth.js"></script>
  <script>
    const storedUserToken = CampusAuth.getUserToken();
    const guestModeRequested = new URLSearchParams(window.location.search).get('guest') === '1';
    if (guestModeRequested) CampusAuth.clearUserAuth();
    if (!guestModeRequested && (!storedUserToken || !localStorage.getItem('campusbot_user') || CampusAuth.isUserTokenExpired(storedUserToken))) {
      CampusAuth.clearUserAuth();
      document.documentElement.style.visibility = 'hidden';
      window.location.replace('auth/login.html');
    }
  </script>
</head>

<body data-theme="dark">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">

      <button class="mobile-menu-btn" id="mobileMenuBtn">
        ☰
      </button>

      <div class="bot-avatar">
        <span class="bot-icon">🎓</span>
        <span class="status-dot"></span>
      </div>

      <div class="bot-info">
        <h1 class="bot-name">CampusBot</h1>
        <span class="bot-status">
          Online · Always here to help
        </span>
      </div>

    </div>

    <div class="header-right">
      <!-- Language stays in the header on mobile. Theme moves to the
           drawer there; account actions live in the sidebar at every size. -->
      <div class="lang-dropdown">

        <button class="lang-current" id="langCurrentBtn">

          EN ⌄

        </button>

        <div class="lang-menu" id="langMenu">

          <button class="lang-btn active" data-lang="en">
            EN
          </button>

          <button class="lang-btn" data-lang="hi">
            हिन्दी
          </button>

          <button class="lang-btn" data-lang="mr">
            Marathi
          </button>

          <button class="lang-btn" data-lang="ta">
            தமிழ்
          </button>

          <button class="lang-btn" data-lang="te">
            తెలుగు
          </button>

        </div>

      </div>
      <!-- Theme Toggle -->
      <button class="theme-toggle header-only" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">☀️</span>
      </button>

    </div>

  </header>

  <!-- Dark overlay behind the sidebar drawer on mobile — tapping
       anywhere on it (i.e. outside the sidebar) closes the drawer. -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-layout">

    <!-- SIDEBAR: Quick Topics -->
    <aside class="sidebar">

      <!-- New Chat -->
      <button class="sidebar-row sidebar-row-accent" onclick="window.createNewChat()">
        <span class="sidebar-row-icon">➕</span> New Chat
      </button>

      <!-- Chat History -->
      <div class="sidebar-section">
        <button id="historyToggle" class="sidebar-row sidebar-history-toggle" aria-expanded="false" aria-controls="historyPanel">
          <span class="sidebar-row-icon">🕘</span> Chat History <span class="history-chevron">⌄</span>
        </button>
        <div id="historyPanel" class="history-panel" hidden>
        <h3 class="sidebar-title">Recent Chats · 15 days</h3>
        <div id="historyNotice" class="history-notice" role="status" hidden></div>
        <div id="historyList" class="sidebar-list history-list">
          <!-- Injected by JS -->
        </div>
        <button id="clearHistoryBtn" class="sidebar-row sidebar-row-muted">
          <span class="sidebar-row-icon">🗑</span> Clear History
        </button>
        </div>
      </div>

      <!-- Learning destination stays easy to reach, visually separate from chat controls. -->
      <div class="sidebar-section learning-section">
        <h3 class="sidebar-title">Learning</h3>
        <a href="study.html" class="sidebar-row sidebar-row-study">
          <span class="sidebar-row-icon">📚</span> Study Material
        </a>
      </div>

      <!-- Quick Topics -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Quick Topics</h3>
        <div class="sidebar-list topic-list" id="topicList">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- Spacer pushes everything below to the bottom, like Claude's
           pinned account/settings row -->
      <div class="sidebar-spacer"></div>

      <!-- Account and settings stay together on desktop and mobile. -->
      <div class="sidebar-bottom">
        <button class="account-summary" id="accountSummary" aria-label="Open account profile">
          <span class="account-avatar" id="accountAvatar">👤</span>
          <span class="account-identity">
            <strong id="accountName">Guest</strong>
            <small id="accountHint">Sign in to sync your chats</small>
          </span>
          <span class="account-chevron">↗</span>
        </button>
        <button class="sidebar-row sidebar-theme-mobile" id="themeToggleMobile">
          <span class="sidebar-row-icon theme-icon">☀️</span> Toggle Theme
        </button>
      </div>

      <!-- Contact / help footer -->
      <div class="sidebar-footer">
        <p>Need human help?</p>
        <a href="mailto:helpdesk@college.edu" class="contact-link">📧 helpdesk@college.edu</a>
        <a href="tel:+911234567890" class="contact-link">📞 +91 12345 67890</a>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">

      <!-- Messages Container -->
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Suggestion Chips -->
      <div class="chips-row" id="chipsRow">
        <!-- Injected by JS -->
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <input type="text" id="userInput" class="chat-input" placeholder="Ask me anything about your college…"
          autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

    </main>

  </div>

  <!-- ===== FEEDBACK MODAL ===== -->
  <div class="modal-overlay" id="feedbackModal" style="display:none">
    <div class="modal">
      <h3>Rate this answer</h3>
      <div class="stars" id="starRating">
        <span class="star" data-val="1">★</span>
        <span class="star" data-val="2">★</span>
        <span class="star" data-val="3">★</span>
        <span class="star" data-val="4">★</span>
        <span class="star" data-val="5">★</span>
      </div>
      <textarea id="feedbackText" placeholder="Any comments? (optional)"></textarea>
      <div class="modal-actions">
        <button class="btn-primary" id="submitFeedback">Submit</button>
        <button class="btn-ghost" id="closeFeedback">Skip</button>
      </div>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ── Sidebar drawer overlay (mobile) ─────────────────────────
    // app.js already toggles the .sidebar's "active" class from the
    // hamburger button — we don't touch that here to avoid double
    // toggling. We just: (1) keep the dark overlay in sync with the
    // sidebar's open/closed state automatically, and (2) close the
    // sidebar when the overlay itself is tapped (i.e. anywhere
    // outside the sidebar).
    const sidebarEl = document.querySelector('.sidebar');
    const sidebarOverlayEl = document.getElementById('sidebarOverlay');

    if (sidebarEl && sidebarOverlayEl) {
      const syncOverlay = () => {
        sidebarOverlayEl.classList.toggle('active', sidebarEl.classList.contains('active'));
      };
      new MutationObserver(syncOverlay).observe(sidebarEl, { attributes: true, attributeFilter: ['class'] });
      const arrivalParams = new URLSearchParams(window.location.search);
      const openSidebarOnArrival = arrivalParams.get('sidebar') === 'open' || window.location.hash === '#open-sidebar';
      const openHistoryOnArrival = arrivalParams.get('history') === 'open';
      if (openSidebarOnArrival) sidebarEl.classList.add('active');
      if (openHistoryOnArrival) {
        const historyToggleEl = document.getElementById('historyToggle');
        const historyPanelEl = document.getElementById('historyPanel');
        if (historyPanelEl) historyPanelEl.hidden = false;
        historyToggleEl?.setAttribute('aria-expanded', 'true');
      }
      syncOverlay();
      if (openSidebarOnArrival || openHistoryOnArrival) {
        try { history.replaceState({}, document.title, window.location.pathname); } catch (err) {}
      }

      sidebarOverlayEl.addEventListener('click', () => {
        sidebarEl.classList.remove('active');
      });
    }

    // ── Optional Login Support ─────────────────────
    // Chatbot works even without login

    const user = (typeof CampusAuth !== 'undefined')
      ? CampusAuth.getUser()
      : null;

    // ── If logged in ───────────────────────────────
    if (user) {

      // Show user name
      const statusEl = document.querySelector('.bot-status');

      if (statusEl) {
        statusEl.textContent = `👤 ${user.name} · Online`;
      }
    }

    // One account surface handles both signed-out and signed-in states.
    const accountName = document.getElementById('accountName');
    const accountHint = document.getElementById('accountHint');
    const accountAvatar = document.getElementById('accountAvatar');
    const accountSummary = document.getElementById('accountSummary');
    accountSummary.classList.toggle('guest', !user);
    accountSummary.setAttribute('aria-label', user ? 'Open profile' : 'Go to sign in');
    if (user) {
      accountName.textContent = user.name || 'My account';
      accountHint.textContent = user.email || 'Signed in';
      accountAvatar.textContent = (user.name || user.email || 'U').trim().charAt(0).toUpperCase();
    } else {
      accountName.textContent = 'Guest mode';
      accountHint.textContent = 'Sign in to sync your chats';
      accountAvatar.textContent = '👤';
    }

    accountSummary.addEventListener('click', () => {
      window.location.href = user ? 'profile.html' : 'auth/login.html';
    });

    // ── Theme toggle (shared by header + sidebar drawer buttons) ───
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      document.querySelectorAll('.theme-icon').forEach(i => i.textContent = theme === 'dark' ? '☀️' : '🌙');
    }
    applyTheme(localStorage.getItem('theme') || 'dark');

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }
    document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMobile')?.addEventListener('click', toggleTheme);

  </script>
</body>

</html>
