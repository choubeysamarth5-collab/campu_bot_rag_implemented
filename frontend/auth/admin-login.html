<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusBot – Admin Login</title>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="stylesheet" href="../css/web-ui.css"/>
</head>
<body class="admin-auth-page">

  <a href="../index.html" class="back-link">← Chat</a>

  <main class="auth-card admin-auth-card">

    <div class="admin-auth-brand">
      <div class="logo-icon">⚙️</div>
      <div>
        <p class="admin-auth-eyebrow">CampusBot · Administration</p>
        <h1>Admin sign in</h1>
        <p class="subtitle">Manage users, FAQs and study content.</p>
      </div>
    </div>

    <!-- Alert -->
    <div class="alert" id="adminAlert"></div>

    <!-- Admin Login Form -->
    <form class="auth-form" id="adminLoginForm" onsubmit="handleAdminLogin(event)">

      <div class="form-group">
        <label>Admin Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="adminEmail" class="form-input"
                 placeholder="admin@college.edu" required autocomplete="username"/>
        </div>
      </div>

      <div class="form-group">
        <label>Admin Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input type="password" id="adminPassword" class="form-input"
                 placeholder="Admin password" required autocomplete="current-password"/>
          <button type="button" class="pw-toggle" onclick="togglePw('adminPassword', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="adminLoginBtn">
        <span class="btn-text">Sign in to admin</span>
        <div class="spinner"></div>
      </button>

    </form>

    <p class="auth-footer admin-auth-footer">
      Signing in as a student? <a href="login.html">Go to student login</a>
    </p>
  </main>

  <script src="auth.js"></script>
  <script src="../js/web-ui.js"></script>
  <script>
    // Redirect if already logged in as admin
    CampusAuth.redirectIfAdminLoggedIn('../admin.html');

    function togglePw(id, btn) {
      const el = document.getElementById(id);
      const isText = el.type === 'text';
      el.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁️' : '🙈';
    }

    // ================================================================
    // ADMIN LOGIN
    // Uses /api/admin/auth/login  (different endpoint from user login)
    // Saves token with ADMIN key in localStorage
    // ================================================================
    async function handleAdminLogin(e) {
      e.preventDefault();
      CampusAuth.hideAlert('adminAlert');
      CampusAuth.setLoading('adminLoginBtn', true);

      const email    = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res  = await fetch(`${CampusAuth.API}/admin/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          // Save with ADMIN key — different from user token
          CampusAuth.saveAdminAuth(data.token, data.admin);
          CampusAuth.showAlert('adminAlert', data.message, 'success');
          setTimeout(() => window.location.href = '../admin.html', 800);
        } else {
          CampusAuth.showAlert('adminAlert', data.message || 'Login failed.');
        }
      } catch (err) {
        CampusAuth.showAlert('adminAlert',
          'Cannot connect to server. Make sure backend is running on port 5000.', 'info');
      } finally {
        CampusAuth.setLoading('adminLoginBtn', false);
      }
    }

  </script>
</body>
</html>
