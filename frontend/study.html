<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Assistant - CampusBot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <!-- PDF generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1117;
      --bg-elevated: #171a23;
      --border: #262b38;
      --text: #f2f3f7;
      --text-muted: #8a8fa3;
      --accent: #6366f1;
      --accent-soft: #6366f122;
      --user-bubble: #6366f1;
      --bot-bubble: #1e2230;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100dvh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .study-app {
      max-width: 980px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .study-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      flex-shrink: 0;
    }

    .study-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .study-title {
      min-width: 0;
      flex: 1;
    }

    .study-title h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .study-title span {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .export-pdf-btn,
    .quiz-btn,
    .back-link {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      white-space: nowrap;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .export-pdf-btn,
    .quiz-btn {
      gap: 7px;
      padding: 0 13px;
      color: var(--text);
      background: var(--accent-soft);
      border: 1px solid rgba(99, 102, 241, 0.45);
      cursor: pointer;
      font-size: 0.82rem;
    }

    .export-pdf-btn:hover:not(:disabled),
    .quiz-btn:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .export-pdf-btn:disabled,
    .quiz-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .export-icon,
    .quiz-icon {
      font-size: 0.95rem;
      line-height: 1;
    }

    .export-dropdown {
      position: relative;
    }

    .export-chevron {
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }

    .export-dropdown.open .export-chevron {
      transform: rotate(180deg);
    }

    .export-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 260px;
      max-width: calc(100vw - 28px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      padding: 6px;
      z-index: 30;
      display: none;
    }

    .export-dropdown.open .export-dropdown-menu {
      display: block;
    }

    .export-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 10px 11px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-family: var(--font-body);
    }

    .export-option:hover {
      background: var(--accent-soft);
    }

    .export-option-icon {
      font-size: 1.05rem;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .export-option-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .export-option-text strong {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .export-option-text small {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
      white-space: normal;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      padding: 0 12px;
    }

    .back-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* =========================================================
       PDF PROGRESS
    ========================================================= */

    .pdf-progress {
      display: none;
      padding: 10px 20px 11px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pdf-progress.show {
      display: block;
    }

    .pdf-progress-inner {
      width: 100%;
    }

    .pdf-progress-title {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .pdf-progress-bar {
      width: 100%;
      height: 6px;
      background: #252936;
      border-radius: 999px;
      overflow: hidden;
    }

    .pdf-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    .pdf-progress-status {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.74rem;
      line-height: 1.3;
    }

    /* =========================================================
       SUBJECT DROPDOWN
    ========================================================= */

    .subject-bar {
      padding: 10px 20px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }

    .subject-dropdown {
      position: relative;
      display: inline-block;
      max-width: 260px;
    }

    .subject-dropdown-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .subject-dropdown-btn:hover,
    .subject-dropdown.open .subject-dropdown-btn {
      border-color: var(--accent);
    }

    .subject-dropdown-btn .label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-dropdown-btn .chevron {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .subject-dropdown.open .subject-dropdown-btn .chevron {
      transform: rotate(180deg);
    }

    .subject-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 100%;
      max-height: 260px;
      overflow-y: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 20;
      display: none;
      padding: 6px;
    }

    .subject-dropdown.open .subject-dropdown-menu {
      display: block;
    }

    .subject-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    .subject-option:hover {
      background: var(--accent-soft);
    }

    .subject-option.selected {
      color: var(--accent);
      font-weight: 600;
    }

    .subject-option .check {
      opacity: 0;
      color: var(--accent);
    }

    .subject-option.selected .check {
      opacity: 1;
    }

    /* =========================================================
       CHAT AREA
    ========================================================= */

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overscroll-behavior: contain;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 320px;
    }

    .empty-state .icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      font-family: var(--font-display);
      color: var(--text);
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .empty-state p {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 70%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.bot {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .msg-row.user .msg-avatar {
      background: var(--accent);
    }

    .msg-row.bot .msg-avatar {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
    }

    .bubble {
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-row.bot .bubble.no-match {
      color: var(--text-muted);
      font-style: italic;
    }

    .bubble p {
      margin: 0 0 8px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble .pdf-lines {
      margin: 0 0 8px;
    }

    .bubble .pdf-lines .pdf-line {
      margin: 0 0 2px;
    }

    .bubble .pdf-lines .pdf-line:last-child {
      margin-bottom: 0;
    }

    .bubble ul,
    .bubble ol {
      margin: 4px 0 9px;
      padding-left: 22px;
    }

    .bubble li {
      margin-bottom: 4px;
    }

    .bubble h4 {
      margin: 10px 0 6px;
      font-family: var(--font-display);
      font-size: 0.95rem;
    }

    .bubble h4:first-child {
      margin-top: 0;
    }

    .bubble strong {
      color: var(--text);
    }

    .bubble code {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 0.86em;
    }

    .bubble pre {
      margin: 9px 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0b0d12;
      border: 1px solid var(--border);
      overflow-x: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.82rem;
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
    }

    .bubble table.pdf-table {
      width: 100%;
      border-collapse: collapse;
      margin: 9px 0;
      font-size: 0.86em;
    }

    .bubble table.pdf-table th,
    .bubble table.pdf-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    .bubble table.pdf-table th {
      background: rgba(99, 102, 241, 0.15);
      font-weight: 600;
    }

    .bubble .streaming-text::after {
      content: "▍";
      display: inline-block;
      margin-left: 2px;
      animation: blink-cursor 1s steps(2) infinite;
    }

    @keyframes blink-cursor {

      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    /* =========================================================
       QUIZ WIDGET
    ========================================================= */

    .quiz-card {
      width: 100%;
    }

    .quiz-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .quiz-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .quiz-question {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .quiz-question:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .quiz-question-num {
      font-size: 0.74rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .quiz-question-text {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .quiz-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.86rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .quiz-option:disabled {
      cursor: default;
    }

    .quiz-option .quiz-option-letter {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .quiz-option.correct {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.14);
    }

    .quiz-option.correct .quiz-option-letter {
      background: #22c55e;
      color: #0f1117;
    }

    .quiz-option.incorrect {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.14);
    }

    .quiz-option.incorrect .quiz-option-letter {
      background: #ef4444;
      color: #0f1117;
    }

    .quiz-explanation {
      margin-top: 9px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .quiz-score {
      margin-top: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.92rem;
      text-align: center;
    }

    /* =========================================================
       TYPING
    ========================================================= */

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================================================
       INPUT
    ========================================================= */

    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.92rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }

    .send-btn:hover {
      opacity: 0.88;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 640px) {
      .study-app {
        max-width: 100%;
      }

      .study-header {
        padding: 10px 14px;
        gap: 9px;
      }

      .study-avatar {
        width: 34px;
        height: 34px;
        font-size: 1.05rem;
      }

      .study-title h1 {
        font-size: 0.98rem;
      }

      .study-title span {
        display: none;
      }

      .header-actions {
        gap: 6px;
      }

      .export-pdf-btn,
      .quiz-btn {
        width: 32px;
        height: 32px;
        padding: 0;
      }

      .export-text,
      .quiz-text {
        display: none;
      }

      .export-icon,
      .quiz-icon {
        font-size: 0.95rem;
      }

      .export-chevron {
        display: none;
      }

      .export-dropdown-menu {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100%;
        border-radius: 18px 18px 0 0;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
      }

      .export-option {
        padding: 13px 12px;
      }

      .back-link {
        font-size: 0;
        padding: 0;
        width: 32px;
        height: 32px;
      }

      .back-link::before {
        content: "←";
        font-size: 1rem;
      }

      .pdf-progress {
        padding: 9px 14px 10px;
      }

      .subject-bar {
        padding: 8px 14px;
      }

      .subject-dropdown {
        max-width: 100%;
        width: 100%;
      }

      .chat-messages {
        padding: 14px;
      }

      .msg-row {
        max-width: 92%;
      }

      .input-bar {
        padding: 10px 14px;
      }

      .chat-input {
        padding: 11px 16px;
      }

      .send-btn {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="study-app">

  <div class="study-app">

  <!-- =======================================================
       HEADER
  ======================================================== -->
  <header class="study-header">

    <div class="study-avatar">📚</div>

    <div class="study-title">
      <h1>Study Assistant</h1>
      <span>Ask questions from your teacher's uploaded notes</span>
    </div>

    <div class="header-actions">

      <!-- =================================================
           EXPORT PDF DROPDOWN
      ================================================== -->
      <div class="export-dropdown" id="exportDropdown">

        <button
          type="button"
          class="export-pdf-btn"
          id="exportPdfBtn"
          title="Export current chat as PDF"
          aria-haspopup="true"
          aria-expanded="false"
          disabled
        >
          <span class="export-icon">📄</span>
          <span class="export-text">Export PDF</span>
          <span class="export-chevron">▾</span>
        </button>

        <div
          class="export-dropdown-menu"
          id="exportDropdownMenu"
        >

          <!-- Complete Study PDF -->
          <button
            type="button"
            class="export-option"
            data-export-mode="complete"
          >
            <span class="export-option-icon">📄</span>

            <span class="export-option-text">
              <strong>Complete Study PDF</strong>
              <small>
                Notes + Conversation + Revision Summary + Visual Learning
              </small>
            </span>
          </button>


          <!-- Visual Revision PDF -->
          <button
            type="button"
            class="export-option"
            data-export-mode="visual"
          >
            <span class="export-option-icon">🧠</span>

            <span class="export-option-text">
              <strong>Visual Revision PDF</strong>
              <small>
                Only diagrams/flowcharts + quick recall points
              </small>
            </span>
          </button>


          <!-- Generate Both -->
          <button
            type="button"

    /* =========================================================
       SAFE HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       MARKDOWN FORMATTER
       Used both by chat and PDF.
    ========================================================= */

    function formatBotText(text) {

      if (!text) {
        return "";
      }

      let source =
        String(text)
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n");

      /*
        Protect fenced code blocks first.
      */

      const codeBlocks = [];

      source = source.replace(
        /```([\s\S]*?)```/g,
        (_, code) => {

          const index =
            codeBlocks.length;

          codeBlocks.push(
            `<pre><code>${escapeHtml(
              code.replace(/^\n|\n$/g, "")
            )}</code></pre>`
          );

          return `@@CODEBLOCK${index}@@`;

        }
      );

      const lines =
        source
          .split("\n")
          .map((line) => escapeHtml(line));

      let html = "";

      let inUl = false;
      let inOl = false;
      let paragraphLines = [];


      function closeLists() {

        if (inUl) {
          html += "</ul>";
          inUl = false;
        }

        if (inOl) {
          html += "</ol>";
          inOl = false;
        }

      }


      function applyInlineMarkdown(value) {

        return value

          /*
            Restore literal <br> markers.

            The backend (RAG note-summary generator) intentionally
            emits "<br>" inside table cells to separate sub-points.
            escapeHtml() turns that into the literal text "&lt;br&gt;",
            which shows up as visible "<br>" text instead of a line
            break. Only this exact tag (no attributes, br/br only) is
            restored — nothing else escaped-HTML is ever un-escaped,
            so this can't be used to inject arbitrary markup.
          */
          .replace(
            /&lt;br\s*\/?&gt;/gi,
            "<br>"
          )

          /* inline code */
          .replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
          )

          /* bold + italic */
          .replace(
            /\*\*\*(.+?)\*\*\*/g,
            "<strong><em>$1</em></strong>"
          )

          /* bold */
          .replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
          )

          /* italic */
          .replace(
            /(?<!\*)\*([^*]+)\*(?!\*)/g,
            "<em>$1</em>"
          )

          /* underscore italic */
          .replace(
            /_([^_]+)_/g,
            "<em>$1</em>"
          );

      }


      function flushParagraph() {

        if (!paragraphLines.length) {
          return;
        }

        const cleaned =
          paragraphLines
            .map((l) => l.trim())
            .filter(Boolean);

        if (!cleaned.length) {
          paragraphLines = [];
          return;
        }

        if (cleaned.length === 1) {

          html += `<p>${applyInlineMarkdown(cleaned[0])}</p>`;

        } else {

          /*
            Multiple consecutive lines (e.g. pipe-style "table" rows)
            used to be joined with <br> inside ONE <p>. That made the
            whole block a single DOM element for PDF pagination, so a
            page-break falling mid-block either moved the entire block
            or — when that left too little content on the page — fell
            back to a raw pixel cut, slicing a row in half and making
            it appear duplicated across the page boundary.

            Rendering each line as its own block element gives the PDF
            pagination logic a bounding box PER LINE, so it can break
            cleanly between rows instead of through one.
          */

          const linesHtml =
            cleaned
              .map((l) => `<div class="pdf-line">${applyInlineMarkdown(l)}</div>`)
              .join("");

          html += `<div class="pdf-lines">${linesHtml}</div>`;

        }

        paragraphLines = [];

      }


      /*
        MARKDOWN TABLE HELPERS

        The RAG backend sends real markdown pipe-tables (header row +
        "|---|---|" separator row + body rows). These were previously
        falling through to the generic "consecutive lines" handling,
        which just stacked raw "| ... |" text instead of rendering an
        actual table.
      */

      function isTableRowLine(value) {
        return /^\|.*\|$/.test(value);
      }

      function isTableSeparatorLine(value) {
        return /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(value);
      }

      function splitTableRow(value) {

        let inner = value.trim();

        if (inner.startsWith("|")) {
          inner = inner.slice(1);
        }

        if (inner.endsWith("|")) {
          inner = inner.slice(0, -1);
        }

        return inner.split("|").map((cell) => cell.trim());

      }


      for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {

        const rawLine =
          lines[lineIndex];

        const line =
          rawLine.trim();

        /*
          Markdown table
          (header row + separator row + 1+ body rows)
        */

        const nextLine =
          (lines[lineIndex + 1] || "").trim();

        if (
          isTableRowLine(line) &&
          isTableSeparatorLine(nextLine)
        ) {

          flushParagraph();
          closeLists();

          const headerCells =
            splitTableRow(line)
              .map((cell) => applyInlineMarkdown(cell));

          lineIndex += 2; // skip header row + separator row

          const bodyRows = [];

          while (
            lineIndex < lines.length &&
            isTableRowLine(lines[lineIndex].trim())
          ) {

            bodyRows.push(
              splitTableRow(lines[lineIndex].trim())
                .map((cell) => applyInlineMarkdown(cell))
            );

            lineIndex++;

          }

          lineIndex--; // compensate for the loop's own increment

          let tableHtml =
            '<table class="pdf-table"><thead><tr>';

          headerCells.forEach((cell) => {
            tableHtml += `<th>${cell}</th>`;
          });

          tableHtml += "</tr></thead><tbody>";

          bodyRows.forEach((row) => {

            tableHtml += "<tr>";

            row.forEach((cell) => {
              tableHtml += `<td>${cell}</td>`;
            });

            tableHtml += "</tr>";

          });

          tableHtml += "</tbody></table>";

          html += tableHtml;

          continue;
        }

        /*
          Code block placeholder
        */

        const codeMatch =
          line.match(/^@@CODEBLOCK(\d+)@@$/);

        if (codeMatch) {

          flushParagraph();
          closeLists();

          html +=
            codeBlocks[
            Number(codeMatch[1])
            ];

          continue;
        }


        /*
          Heading
        */

        const headingMatch =
          line.match(/^#{1,4}\s+(.+)$/);

        if (headingMatch) {

          flushParagraph();
          closeLists();

          html +=
            `<h4>${applyInlineMarkdown(
              headingMatch[1]
            )}</h4>`;

          continue;
        }


        /*
          Bullet list
        */

        const bulletMatch =
          line.match(/^[-*•]\s+(.+)$/);

        if (bulletMatch) {

          flushParagraph();

          if (inOl) {
            html += "</ol>";
            inOl = false;
          }

          if (!inUl) {
            html += "<ul>";
            inUl = true;
          }

          html +=
            `<li>${applyInlineMarkdown(
              bulletMatch[1]
            )}</li>`;

          continue;
        }


        /*
          Numbered list
        */

        const numberMatch =
          line.match(/^\d+[.)]\s+(.+)$/);

        if (numberMatch) {

          flushParagraph();

          if (inUl) {
            html += "</ul>";
            inUl = false;
          }

          if (!inOl) {
            html += "<ol>";
            inOl = true;
          }

          html +=
            `<li>${applyInlineMarkdown(
              numberMatch[1]
            )}</li>`;

          continue;
        }


        /*
          Empty line
        */

        if (!line) {

          flushParagraph();
          closeLists();

          continue;
        }


        /*
          Normal paragraph line
        */

        closeLists();

        paragraphLines.push(line);

      }


      flushParagraph();
      closeLists();


      return html;
    }


    /* =========================================================
       CHAT UI
    ========================================================= */

    function appendUserMessage(text) {

      if (emptyState) {
        emptyState.remove();
      }

      /*
        Export becomes available after chat starts.
      */
      exportPdfBtn.disabled =
        conversationHistory.length === 0 &&
        !text;

      quizBtn.disabled =
        exportPdfBtn.disabled;

      const row =
        document.createElement("div");

      row.className =
        "msg-row user";

      const avatar =
        document.createElement("div");

      avatar.className =
        "msg-avatar";

      avatar.textContent =
        "🧑";

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      /*
        User text is deliberately rendered as text,
        never as HTML.
      */
      bubble.textContent =
        text;

      row.appendChild(avatar);
      row.appendChild(bubble);

      chatMessages.appendChild(row);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

      return row;
    }


    function appendBotTyping() {

      const row =
        document.createElement("div");

      row.className =
        "msg-row bot";

      row.innerHTML = `
        <div class="msg-avatar">📚</div>
        <div class="bubble">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

      chatMessages.appendChild(row);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

      return row;
    }


    function renderBotReply(row, data) {

      const bubble =
        row.querySelector(".bubble");

      bubble.classList.remove("no-match");

      bubble.innerHTML =
        formatBotText(
          data.reply ||
          "Something went wrong."
        );

      if (data.matched === false) {
        bubble.classList.add("no-match");
      }

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }


    /*
      STREAMING REPLY

      Reads the response body as it arrives and shows it token-by-token
      instead of waiting for the whole answer. While streaming, the
      partial text is shown as PLAIN TEXT (textContent, never
      innerHTML) — markdown/table formatting is only applied once the
      stream completes, so a half-arrived "**bold" or "| table |" row
      can never render as broken/unsafe HTML mid-stream.

      Returns the full accumulated reply text once the stream ends.
    */
    async function streamBotReply(row, res) {

      const bubble =
        row.querySelector(".bubble");

      bubble.classList.remove("no-match");

      bubble.innerHTML = "";

      const streamEl =
        document.createElement("span");

      streamEl.className =
        "streaming-text";

      bubble.appendChild(streamEl);


      const reader =
        res.body.getReader();

      const decoder =
        new TextDecoder();

      let accumulated = "";


      while (true) {

        const { value, done } =
          await reader.read();

        if (done) {
          break;
        }

        accumulated +=
          decoder.decode(
            value,
            { stream: true }
          );

        streamEl.textContent =
          accumulated;

        chatMessages.scrollTop =
          chatMessages.scrollHeight;

      }


      bubble.innerHTML =
        formatBotText(
          accumulated ||
          "Something went wrong."
        );

      chatMessages.scrollTop =
        chatMessages.scrollHeight;


      return accumulated;
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

      const message =
        chatInput.value.trim();

      if (!message) {
        return;
      }

      chatInput.value = "";

      sendBtn.disabled = true;

      appendUserMessage(message);

      conversationHistory.push({
        role: "user",
        text: message
      });

      const typingRow =
        appendBotTyping();


      try {

        const res =
          await CampusAuth.userFetch(
            "/study/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message,

                subject:
                  selectedSubject || undefined,

                /*
                  IMPORTANT:
                  Only latest 6 messages go to backend.
                  Complete history stays locally.
                */
                history:
                  conversationHistory.slice(-6)

              })
            }
          );


        if (res.status === 401) {

          renderBotReply(
            typingRow,
            {
              reply:
                "Please log in to use the Study section.",
              matched: false
            }
          );

          return;
        }


        if (!res.ok) {
          throw new Error(
            `HTTP ${res.status}`
          );
        }


        /*
          BACKWARD-COMPATIBLE STREAMING DETECTION.

          If /study/chat responds with JSON (the current behaviour),
          nothing changes. If the backend is upgraded to stream plain
          text chunks (Content-Type NOT application/json, with an
          optional "X-Matched: false" response header for no-match
          answers), we stream it live instead. No backend change
          required for this frontend to keep working.
        */

        const contentType =
          res.headers.get("content-type") || "";

        const canStream =
          !contentType.includes("application/json") &&
          res.body &&
          typeof res.body.getReader === "function";

        let finalReply = "";
        let matched = true;


        if (canStream) {

          const matchedHeader =
            res.headers.get("x-matched");

          if (matchedHeader !== null) {
            matched =
              matchedHeader !== "false";
          }

          finalReply =
            await streamBotReply(
              typingRow,
              res
            );

          if (!matched) {

            typingRow
              .querySelector(".bubble")
              .classList.add("no-match");

          }

        } else {

          const data =
            await res.json();

          finalReply =
            data.reply || "";

          matched =
            data.matched !== false;

          renderBotReply(
            typingRow,
            data
          );

        }


        conversationHistory.push({
          role: "bot",
          text: finalReply
        });


        /*
          Enable PDF / Quiz after a successful assistant response.
        */
        exportPdfBtn.disabled =
          conversationHistory.length === 0;

        quizBtn.disabled =
          conversationHistory.length === 0;


      } catch (err) {

        console.error(
          "Study chat error:",
          err
        );

        renderBotReply(
          typingRow,
          {
            reply:
              "Server se connect nahi ho pa raha.",
            matched: false
          }
        );


      } finally {

        sendBtn.disabled = false;

        chatInput.focus();

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    chatInput.addEventListener(
      "keypress",
      (e) => {

        if (e.key === "Enter") {
          sendMessage();
        }

      }
    );

    /* =========================================================
       AI SUMMARY
    ========================================================= */

    async function generateRevisionSummary(
      chatSnapshot,
      subjectSnapshot
    ) {

      try {

        const res =
          await CampusAuth.userFetch(
            "/study/summary",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                subject:
                  subjectSnapshot || "",

                history:
                  chatSnapshot

              })
            }
          );


        if (!res.ok) {
          throw new Error(
            `Summary HTTP ${res.status}`
          );
        }


        const data =
          await res.json();


        if (
          !data ||
          !data.summary ||
          !String(data.summary).trim()
        ) {
          throw new Error(
            "Empty summary returned"
          );
        }


        return String(
          data.summary
        ).trim();


      } catch (err) {

        /*
          VERY IMPORTANT:
          Summary failure must NOT stop PDF creation.
        */

        console.warn(
          "Revision summary unavailable. PDF will continue without it.",
          err
        );

        return null;

      }

    }


    /* =========================================================
       PDF DOCUMENT HELPERS
    ========================================================= */

    function createPdfElement(
      tag,
      className,
      text
    ) {

      const el =
        document.createElement(tag);

      if (className) {
        el.className =
          className;
      }

      if (text !== undefined) {
        el.textContent =
          text;
      }

      return el;
    }


    function addPdfConversationMessage(
      container,
      message
    ) {

      const isUser =
        message.role === "user";


      const block =
        document.createElement("div");

      block.className =
        isUser
          ? "pdf-message pdf-student"
          : "pdf-message pdf-assistant";


      const label =
        createPdfElement(
          "div",
          "pdf-message-label",
          isUser
            ? "Student"
            : "Study Assistant"
        );


      const content =
        document.createElement("div");

      content.className =
        "pdf-message-content";


      if (isUser) {

        /*
          User content is escaped automatically
          by textContent.
        */
        content.textContent =
          message.text || "";

      } else {

        /*
          Assistant response uses safe markdown formatter.
        */
        content.innerHTML =
          formatBotText(
            message.text || ""
          );

      }


      block.appendChild(label);
      block.appendChild(content);

      container.appendChild(block);

    }

    /* =========================================================
       VISUAL LEARNING — DIAGRAM GENERATION

       NOTE: this project had no existing plot/visualization
       implementation to reuse (confirmed with the user), so
       this is a fresh, lightweight SVG renderer. It reuses
       the existing .pdf-table styling for "comparison" type
       visualizations instead of building a second table
       renderer.
    ========================================================= */

    function wrapLabelLines(label, maxCharsPerLine, maxLines) {

      const words =
        String(label || "")
          .split(/\s+/)
          .filter(Boolean);

      const lines = [];
      let current = "";

      words.forEach((word) => {

        const candidate =
          current ? `${current} ${word}` : word;

        if (candidate.length > maxCharsPerLine && current) {
          lines.push(current);
          current = word;
        } else {
          current = candidate;
        }

      });

      if (current) {
        lines.push(current);
      }

      if (lines.length > maxLines) {

        const trimmed =
          lines.slice(0, maxLines);

        trimmed[maxLines - 1] =
          trimmed[maxLines - 1].replace(/.{0,3}$/, "...");

        return trimmed;
      }

      return lines.length ? lines : [""];
    }


    /*
      Layered auto-layout for node/edge diagrams (flowchart,
      process, architecture, hierarchy, decision tree, concept
      map, component-relationship). Each node's "level" is the
      longest path from a root node, so parents always sit
      above their children.
    */
    function layoutDiagramNodes(nodes, edges) {

      const ids =
        nodes.map((n) => n.id);

      const incomingCount = {};

      ids.forEach((id) => {
        incomingCount[id] = 0;
      });

      edges.forEach((e) => {
        if (incomingCount[e.to] !== undefined) {
          incomingCount[e.to]++;
        }
      });

      let roots =
        ids.filter((id) => incomingCount[id] === 0);

      if (!roots.length && ids.length) {
        roots = [ids[0]];
      }

      const level = {};

      ids.forEach((id) => {
        level[id] = 0;
      });

      let changed = true;
      let guard = 0;

      while (changed && guard < ids.length + 5) {

        changed = false;

        edges.forEach((e) => {

          if (
            level[e.from] === undefined ||
            level[e.to] === undefined
          ) {
            return;
          }

          if (level[e.to] < level[e.from] + 1) {
            level[e.to] = level[e.from] + 1;
            changed = true;
          }

        });

        guard++;

      }

      const levels = {};

      nodes.forEach((n) => {
        const lv = level[n.id] || 0;
        (levels[lv] = levels[lv] || []).push(n);
      });

      const levelKeys =
        Object.keys(levels)
          .map(Number)
          .sort((a, b) => a - b);

      const boxWidth = 168;
      const boxMinHeight = 48;
      const hGap = 26;
      const vGap = 56;
      const paddingX = 24;
      const paddingY = 24;
      const maxCharsPerLine = 20;

      const positions = {};
      let maxRowWidth = 0;

      levelKeys.forEach((lv, rowIndex) => {

        const rowNodes =
          levels[lv];

        const rowWidth =
          rowNodes.length * boxWidth +
          (rowNodes.length - 1) * hGap;

        maxRowWidth =
          Math.max(maxRowWidth, rowWidth);

        rowNodes.forEach((node, colIndex) => {

          const lines =
            wrapLabelLines(node.label, maxCharsPerLine, 3);

          const boxHeight =
            Math.max(boxMinHeight, 26 + lines.length * 16);

          positions[node.id] = {
            x: paddingX + colIndex * (boxWidth + hGap),
            y: paddingY + rowIndex * (boxMinHeight + vGap),
            width: boxWidth,
            height: boxHeight,
            lines
          };

        });

      });

      /*
        Center each row against the widest row so the
        diagram looks balanced instead of left-aligned.
      */
      levelKeys.forEach((lv) => {

        const rowNodes =
          levels[lv];

        const rowWidth =
          rowNodes.length * boxWidth +
          (rowNodes.length - 1) * hGap;

        const offset =
          (maxRowWidth - rowWidth) / 2;

        rowNodes.forEach((node) => {
          positions[node.id].x += offset;
        });

      });

      const totalWidth =
        maxRowWidth + paddingX * 2;

      const totalHeight =
        levelKeys.length
          ? Math.max(
            ...levelKeys.map((lv) => {
              const n = levels[lv][0];
              return positions[n.id].y + positions[n.id].height;
            })
          ) + paddingY
          : boxMinHeight + paddingY * 2;

      return { positions, width: totalWidth, height: totalHeight };
    }


    function buildDiagramSvg(viz) {

      const nodes =
        Array.isArray(viz.nodes) ? viz.nodes : [];

      const edges =
        Array.isArray(viz.edges) ? viz.edges : [];

      if (!nodes.length) {
        return "";
      }

      const { positions, width, height } =
        layoutDiagramNodes(nodes, edges);

      let svg =
        `<svg class="viz-diagram" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;

      svg += `
        <defs>
          <marker id="viz-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6366f1"></path>
          </marker>
        </defs>
      `;

      edges.forEach((edge) => {

        const from = positions[edge.from];
        const to = positions[edge.to];

        if (!from || !to) {
          return;
        }

        const x1 = from.x + from.width / 2;
        const y1 = from.y + from.height;
        const x2 = to.x + to.width / 2;
        const y2 = to.y;
        const midY = (y1 + y2) / 2;

        svg +=
          `<path d="M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2 - 6}" fill="none" stroke="#a5adf7" stroke-width="2" marker-end="url(#viz-arrow)"></path>`;

        if (edge.label) {
          svg +=
            `<text x="${(x1 + x2) / 2}" y="${midY - 4}" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Arial, sans-serif">${escapeHtml(edge.label)}</text>`;
        }

      });

      nodes.forEach((node) => {

        const pos = positions[node.id];

        if (!pos) {
          return;
        }

        svg +=
          `<rect x="${pos.x}" y="${pos.y}" width="${pos.width}" height="${pos.height}" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="1.5"></rect>`;

        const lineHeight = 16;

        const startY =
          pos.y + pos.height / 2 -
          ((pos.lines.length - 1) * lineHeight) / 2 + 5;

        pos.lines.forEach((line, i) => {
          svg +=
            `<text x="${pos.x + pos.width / 2}" y="${startY + i * lineHeight}" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle" font-family="Arial, sans-serif">${escapeHtml(line)}</text>`;
        });

      });

      svg += "</svg>";

      return svg;
    }


    /*
      "comparison" type reuses the SAME .pdf-table renderer/
      styling already used for markdown tables in chat — no
      second table implementation.
    */
    function buildComparisonTableHtml(viz) {

      const columns =
        Array.isArray(viz.columns) ? viz.columns : [];

      const rows =
        Array.isArray(viz.rows) ? viz.rows : [];

      if (!columns.length || !rows.length) {
        return "";
      }

      let html =
        '<table class="pdf-table viz-comparison-table"><thead><tr>';

      columns.forEach((col) => {
        html += `<th>${escapeHtml(col)}</th>`;
      });

      html += "</tr></thead><tbody>";

      rows.forEach((row) => {

        html += "<tr>";

        row.forEach((cell) => {
          html += `<td>${escapeHtml(cell)}</td>`;
        });

        html += "</tr>";

      });

      html += "</tbody></table>";

      return html;
    }


    function buildVisualizationCardHtml(viz) {

      const isComparison =
        viz.type === "comparison" &&
        Array.isArray(viz.columns);

      const diagramHtml =
        isComparison
          ? buildComparisonTableHtml(viz)
          : buildDiagramSvg(viz);

      if (!diagramHtml) {
        return "";
      }

      let html =
        '<div class="viz-card">';

      if (viz.title) {
        html += `<div class="viz-title">${escapeHtml(viz.title)}</div>`;
      }

      html += `<div class="viz-diagram-wrap">${diagramHtml}</div>`;

      if (viz.description) {
        html += `<div class="viz-desc">${escapeHtml(viz.description)}</div>`;
      }

      if (viz.remember) {
        html +=
          `<div class="viz-remember"><strong>Remember:</strong> ${escapeHtml(viz.remember)}</div>`;
      }

      html += "</div>";

      return html;
    }


    /* =========================================================
       AI VISUALIZATION GENERATION

       Called ONLY at export time (never during normal chat),
       per the performance requirement — no extra AI call per
       message.
    ========================================================= */

    async function generateVisualizations(chatSnapshot, subjectSnapshot) {

      try {

        const res =
          await CampusAuth.userFetch(
            "/study/visualize",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                subject:
                  subjectSnapshot || "",

                history:
                  chatSnapshot

              })
            }
          );


        if (!res.ok) {
          throw new Error(
            `Visualize HTTP ${res.status}`
          );
        }


        const data =
          await res.json();


        if (
          !data ||
          !Array.isArray(data.visualizations) ||
          !data.visualizations.length
        ) {
          return null;
        }


        return data.visualizations;


      } catch (err) {

        /*
          VERY IMPORTANT:
          Visualization failure must NOT stop PDF creation.
        */

        console.warn(
          "Visualizations unavailable. PDF will continue without them.",
          err
        );

        return null;

      }

    }

            "div",
            "viz-empty-note",
            "Visual diagrams could not be generated for this conversation. Try asking a few concept-style questions (\"how does X work\", \"explain the architecture of Y\") and export again."
          );

        container.appendChild(emptyNote);

        return container;
      }


      visualizations.forEach((viz, index) => {

        const cardHtml =
          buildVisualizationCardHtml(viz);

        if (!cardHtml) {
          return;
        }

        const page =
          document.createElement("div");

        page.className =
          index === 0
            ? "viz-revision-first-page"
            : "viz-revision-page";

        const sectionTitle =
          createPdfElement(
            "div",
            "pdf-visual-section-title",
            index === 0
              ? "Important Visual Concepts"
              : "Next Concept"
          );

        page.appendChild(sectionTitle);

        const wrapper =
          document.createElement("div");

        wrapper.innerHTML =
          cardHtml;

        page.appendChild(wrapper.firstElementChild);

        container.appendChild(page);

      });


      const footer =
        createPdfElement(
          "div",
          "pdf-footer-note",
          "Generated by CampusBot Study Assistant"
        );

      container.appendChild(footer);


      return container;
    }


    /* =========================================================
       CANVAS → PDF RENDERER
       (shared by Complete Study PDF and Visual Revision PDF —
       reuses the existing html2canvas + jsPDF pipeline and the
       existing page-break-avoidance algorithm, extended with
       .viz-card so a diagram is never cut in half.)
    ========================================================= */

    async function renderContainerToPdf(container, filename) {

      document.body.appendChild(container);

      try {

        /* let the browser lay it out before capturing */

        await new Promise(
          (resolve) => setTimeout(resolve, 300)
        );

        await new Promise((resolve) =>
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          })
        );


        const canvas =
          await html2canvas(
            container,
            {
              scale: 2,
              useCORS: true,
              allowTaint: true,
              backgroundColor: "#ffffff",
              logging: false,
              scrollX: 0,
              scrollY: 0,
              width: container.offsetWidth,
              height: container.scrollHeight
            }
          );

        if (
          !canvas ||
          canvas.width === 0 ||
          canvas.height === 0
        ) {
          throw new Error("PDF canvas is empty.");
        }


        const { jsPDF } = window.jspdf;

        const pdf =
          new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
          });

        const pageWidth =
          pdf.internal.pageSize.getWidth();

        const pageHeight =
          pdf.internal.pageSize.getHeight();

        const containerRect =
          container.getBoundingClientRect();

        const canvasScale =
          canvas.width / containerRect.width;

        const topMargin = 12;
        const bottomMargin = 12;

        const pageCanvasHeight =
          canvas.width *
          ((pageHeight - topMargin - bottomMargin) / pageWidth);


        const safeElements = [
          ...container.querySelectorAll(`
            .pdf-header,
            .pdf-section-title,
            .pdf-visual-section-title,
            .pdf-message,
            .pdf-message-content h4,
            .pdf-message-content p,
            .pdf-message-content .pdf-line,
            .pdf-message-content ul,
            .pdf-message-content ol,
            .pdf-message-content li,
            .pdf-message-content pre,
            .pdf-message-content tr,
            .pdf-summary-page,
            .pdf-summary-title,
            .pdf-summary-content h4,
            .pdf-summary-content p,
            .pdf-summary-content .pdf-line,
            .pdf-summary-content ul,
            .pdf-summary-content ol,
            .pdf-summary-content li,
            .pdf-summary-content tr,
            .viz-card
          `)
        ];

        const safePositions = safeElements
          .map((el) => {

            const rect =
              el.getBoundingClientRect();

            return {
              top: (rect.top - containerRect.top) * canvasScale,
              height: rect.height * canvasScale
            };

          })
          .filter((item) =>
            item.top >= 0 && item.top < canvas.height
          )
          .sort((a, b) => a.top - b.top);


        const pageCuts = [];
        let currentStart = 0;

        while (currentStart < canvas.height) {

          const idealEnd =
            Math.min(currentStart + pageCanvasHeight, canvas.height);

          if (idealEnd >= canvas.height) {
            pageCuts.push({ start: currentStart, end: canvas.height });
            break;
          }

          const crossingElements =
            safePositions.filter((item) => {
              const elementBottom = item.top + item.height;
              return (
                item.top > currentStart + 20 &&
                item.top < idealEnd &&
                elementBottom > idealEnd - 15
              );
            });

          let actualEnd = idealEnd;

          if (crossingElements.length > 0) {
            actualEnd = crossingElements[0].top - 30;
          }

          if (actualEnd - currentStart < pageCanvasHeight * 0.60) {
            actualEnd = idealEnd;
          }

          if (actualEnd < canvas.height) {

            const nextElement =
              safePositions.find((item) =>
                item.top >= actualEnd - 2 && item.top < actualEnd + 20
              );

            if (nextElement) {
              actualEnd = nextElement.top - 2;
            }

          }

          if (actualEnd <= currentStart) {
            actualEnd = idealEnd;
          }

          pageCuts.push({ start: currentStart, end: actualEnd });
          currentStart = actualEnd;

        }


        for (
          let pageIndex = 0;
          pageIndex < pageCuts.length;
          pageIndex++
        ) {

          const cut = pageCuts[pageIndex];
          const sliceHeight = cut.end - cut.start;

          const pageCanvas =
            document.createElement("canvas");

          pageCanvas.width = canvas.width;
          pageCanvas.height = Math.ceil(sliceHeight);

          const ctx =
            pageCanvas.getContext("2d");

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);

          ctx.drawImage(
            canvas,
            0, cut.start, canvas.width, sliceHeight,
            0, 0, canvas.width, sliceHeight
          );

          const pageImage =
            pageCanvas.toDataURL("image/jpeg", 0.97);

          if (pageIndex > 0) {
            pdf.addPage();
          }

          const slicePdfHeight =
            (pageCanvas.height * pageWidth) / pageCanvas.width;

          pdf.addImage(
            pageImage, "JPEG", 0, topMargin, pageWidth, slicePdfHeight
          );

        }


        pdf.save(filename);


      } finally {

        try {
          container.remove();
        } catch (_) { }

      }

    }


    /* =========================================================
       EXPORT CURRENT CHAT AS PDF

       mode: "complete" | "visual" | "both"
    ========================================================= */

    async function exportCurrentChatAsPDF(mode) {

      mode = mode || "complete";

      if (
        isExportingPdf ||
        !conversationHistory.length
      ) {
        return;
      }


      /*
        SNAPSHOT FIRST.
        Any new messages after this point will not enter this PDF.
      */
      const chatSnapshot =
        conversationHistory.map((item) => ({
          role: item.role,
          text: item.text
        }));

      const subjectSnapshot =
        selectedSubject || "All Subjects";

      const exportDate =
        new Date();

      const needsComplete =
        mode === "complete" || mode === "both";

      const needsVisual =
        mode === "visual" || mode === "both";

      const safeSubject =
        subjectSnapshot
          .replace(/[^a-z0-9]+/gi, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 50) || "All-Subjects";

      const datePart =
        exportDate.toISOString().slice(0, 10);


      isExportingPdf = true;
      exportPdfBtn.disabled = true;


      try {

        showPdfProgress(
          "Preparing PDF", 8, "Preparing your conversation..."
        );

        await new Promise((r) => setTimeout(r, 150));


        let summary = null;

        if (needsComplete) {

          showPdfProgress(
            "Preparing PDF", 20, "Generating your revision summary..."
          );

          summary =
            await generateRevisionSummary(chatSnapshot, subjectSnapshot);

        }


        /*
          Visualizations are generated ONCE even for "both" —
          both PDFs reuse the same result instead of making a
          second AI call.
        */
        let visualizations = null;

        showPdfProgress(
          "Preparing PDF",
          needsComplete ? 45 : 25,
          "Generating visual learning diagrams..."
        );

        visualizations =
          await generateVisualizations(chatSnapshot, subjectSnapshot);


        if (needsComplete) {

          showPdfProgress(
            "Preparing PDF", 60, "Building your Complete Study PDF..."
          );

          const completeContainer =
            buildCompletePdfContainer(
              chatSnapshot,
              subjectSnapshot,
              exportDate,
              summary,
              visualizations
            );

          const completeFilename =
            `CampusBot-Study-${safeSubject}-${datePart}.pdf`;

          showPdfProgress(
            "Preparing PDF",
            needsVisual ? 75 : 90,
            "Finalizing Complete Study PDF..."
          );

          await renderContainerToPdf(completeContainer, completeFilename);

        }


        if (needsVisual) {

          showPdfProgress(
            "Preparing PDF",
            needsComplete ? 82 : 60,
            "Building your Visual Revision PDF..."
          );

          const visualContainer =
            buildVisualRevisionContainer(
              subjectSnapshot,
              exportDate,
              visualizations
            );

          const visualFilename =
            `CampusBot-VisualRevision-${safeSubject}-${datePart}.pdf`;

          showPdfProgress(
            "Preparing PDF", 92, "Finalizing Visual Revision PDF..."
          );

          await renderContainerToPdf(visualContainer, visualFilename);

        }


        showPdfProgress(
          "PDF Ready",
          100,
          needsComplete && needsVisual
            ? "Both PDFs have been downloaded."
            : "Your study PDF has been downloaded."
        );

        await new Promise((r) => setTimeout(r, 700));


      } catch (err) {

        console.error(
          "PDF export failed:", err
        );

        /*
          Per spec: an optional AI feature (summary/visualization)
          failing must never break the core PDF. This catch is
          only for an actual PDF-generation failure (canvas/jsPDF),
          since summary/visualization failures are already caught
          and neutralized inside their own generate* functions.
        */
        alert(
          "PDF generate nahi ho paaya. Please try again."
        );


      } finally {

        hidePdfProgress();

        isExportingPdf = false;

        exportPdfBtn.disabled =
          conversationHistory.length === 0;

      }

    }



    /* =========================================================
       QUIZ
    ========================================================= */

    function appendBotMessageRow() {

      const row =
        document.createElement("div");

      row.className =
        "msg-row bot";

      const avatar =
        document.createElement("div");

      avatar.className =
        "msg-avatar";

      avatar.textContent =
        "📚";

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      row.appendChild(avatar);
      row.appendChild(bubble);

      chatMessages.appendChild(row);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

      return row;
    }


    function renderQuizLoading(row) {

      const bubble =
        row.querySelector(".bubble");

      bubble.innerHTML = `
        <div class="quiz-card">
          <div class="quiz-loading">
            <div class="typing-dots">
              <span></span><span></span><span></span>
            </div>
            <span>Generating quiz from your notes...</span>
          </div>
        </div>
      `;

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }


    function renderQuizError(row, message) {

      const bubble =
        row.querySelector(".bubble");

      bubble.classList.add("no-match");

      bubble.innerHTML =
        `<div class="quiz-card">${escapeHtml(message)}</div>`;
    }


    function renderQuiz(row, questions) {

      const bubble =
        row.querySelector(".bubble");

      bubble.classList.remove("no-match");

      if (!questions || !questions.length) {

        bubble.innerHTML =
          '<div class="quiz-card">Is conversation se quiz nahi ban paaya — thoda aur padh ke try karo.</div>';

        return;
      }

      const card =
        document.createElement("div");

      card.className =
        "quiz-card";

      const title =
        document.createElement("div");

      title.className =
        "quiz-card-title";

      title.textContent =
        `Quick Quiz (${questions.length} questions)`;

      card.appendChild(title);


      const letters =
        ["A", "B", "C", "D", "E", "F"];

      let score = 0;
      let answered = 0;


      questions.forEach((q, qIndex) => {

        const qWrap =
          document.createElement("div");

        qWrap.className =
          "quiz-question";

        const num =
          document.createElement("div");

        num.className =
          "quiz-question-num";

        num.textContent =
          `Question ${qIndex + 1}`;

        qWrap.appendChild(num);


        const qText =
          document.createElement("div");

        qText.className =
          "quiz-question-text";

        qText.textContent =
          q.question || "";

        qWrap.appendChild(qText);


        const optsWrap =
          document.createElement("div");

        optsWrap.className =
          "quiz-options";


        (q.options || []).forEach((optText, optIndex) => {

          const optBtn =
            document.createElement("button");

          optBtn.type =
            "button";

          optBtn.className =
            "quiz-option";

          const letterSpan =
            document.createElement("span");

          letterSpan.className =
            "quiz-option-letter";

          letterSpan.textContent =
            letters[optIndex] || String(optIndex + 1);

          const textSpan =
            document.createElement("span");

          textSpan.textContent =
            optText;

          optBtn.appendChild(letterSpan);
          optBtn.appendChild(textSpan);


          optBtn.addEventListener(
            "click",
            () => {

              optsWrap
                .querySelectorAll(".quiz-option")
                .forEach((b) => {
                  b.disabled = true;
                });

              const isCorrect =
                optIndex === q.answer;

              optBtn.classList.add(
                isCorrect ? "correct" : "incorrect"
              );

              if (!isCorrect) {

                const correctBtn =
                  optsWrap.children[q.answer];

                if (correctBtn) {
                  correctBtn.classList.add("correct");
                }

              }

              if (q.explanation) {

                const explEl =
                  document.createElement("div");

                explEl.className =
                  "quiz-explanation";

                explEl.textContent =
                  q.explanation;

                qWrap.appendChild(explEl);

              }

              answered++;

              if (isCorrect) {
                score++;
              }

              if (answered === questions.length) {

                const scoreEl =
                  document.createElement("div");

                scoreEl.className =
                  "quiz-score";

                scoreEl.textContent =
                  `Score: ${score} / ${questions.length}`;

                card.appendChild(scoreEl);

              }



            }
          );

          optsWrap.appendChild(optBtn);

        });

        qWrap.appendChild(optsWrap);
        card.appendChild(qWrap);

      });


      bubble.innerHTML = "";
      bubble.appendChild(card);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }


    async function generateQuiz() {

      if (!conversationHistory.length) {
        return;
      }

      quizBtn.disabled = true;

      const row =
        appendBotMessageRow();

      renderQuizLoading(row);


      try {

        const res =
          await CampusAuth.userFetch(
            "/study/quiz",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                subject:
                  selectedSubject || undefined,

                history:
                  conversationHistory.slice(-6)

              })
            }
          );


        if (res.status === 401) {

          renderQuizError(
            row,
            "Please log in to generate a quiz."
          );

          return;
        }


        if (!res.ok) {
          throw new Error(
            `HTTP ${res.status}`
          );
        }


        const data =
          await res.json();

        renderQuiz(
          row,
          data.questions
        );


      } catch (err) {

        console.error(
          "Quiz generation error:",
          err
        );

        renderQuizError(
          row,
          "Quiz generate nahi ho paaya. Please try again."
        );


      } finally {

        quizBtn.disabled =
          conversationHistory.length === 0;

      }

    }


    // quizBtn.addEventListener(
    //   "click",
    //   generateQuiz
    // );


    /* =========================================================
       EXPORT BUTTON
    ========================================================= */

    /*
      NOTE: exportPdfBtn's click listener now only toggles the
      export dropdown (see "EXPORT DROPDOWN" section above).
      Actual PDF generation is triggered per-option via
      exportCurrentChatAsPDF(mode) from the dropdown items.
    */


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadSubjects();

  </script>
