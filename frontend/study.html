<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Assistant - CampusBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --bg-elevated: #171a23;
      --border: #262b38;
      --text: #f2f3f7;
      --text-muted: #8a8fa3;
      --accent: #6366f1;
      --accent-soft: #6366f122;
      --user-bubble: #6366f1;
      --bot-bubble: #1e2230;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100dvh;
      overflow: hidden;
    }

    .study-app {
      max-width: 980px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header, matches index.html's .header look ── */
    .study-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .study-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .study-title { min-width: 0; }
    .study-title h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .study-title span {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .back-link {
      margin-left: auto;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--text); border-color: var(--accent); }

    /* ── Subject dropdown (custom-built — no native OS picker) ── */
    .subject-bar {
      padding: 10px 20px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .subject-dropdown {
      position: relative;
      display: inline-block;
      max-width: 260px;
    }
    .subject-dropdown-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .subject-dropdown-btn:hover,
    .subject-dropdown.open .subject-dropdown-btn {
      border-color: var(--accent);
    }
    .subject-dropdown-btn .label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subject-dropdown-btn .chevron {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      transition: transform 0.15s ease;
    }
    .subject-dropdown.open .subject-dropdown-btn .chevron {
      transform: rotate(180deg);
    }

    .subject-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 100%;
      max-height: 260px;
      overflow-y: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 20;
      display: none;
      padding: 6px;
    }
    .subject-dropdown.open .subject-dropdown-menu { display: block; }

    .subject-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .subject-option:hover { background: var(--accent-soft); }
    .subject-option.selected { color: var(--accent); font-weight: 600; }
    .subject-option .check { opacity: 0; color: var(--accent); }
    .subject-option.selected .check { opacity: 1; }

    /* ── Chat area ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 320px;
    }
    .empty-state .icon { font-size: 2.4rem; margin-bottom: 10px; }
    .empty-state h3 {
      font-family: var(--font-display);
      color: var(--text);
      margin: 0 0 6px;
      font-size: 1rem;
    }
    .empty-state p { margin: 0; font-size: 0.85rem; line-height: 1.5; }

    .msg-row { display: flex; gap: 10px; max-width: 70%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot { align-self: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
    }
    .msg-row.user .msg-avatar { background: var(--accent); }
    .msg-row.bot .msg-avatar { background: var(--bot-bubble); border: 1px solid var(--border); }

    .bubble {
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-row.bot .bubble.no-match { color: var(--text-muted); font-style: italic; }

    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul { margin: 4px 0 8px; padding-left: 20px; }
    .bubble li { margin-bottom: 4px; }
    .bubble h4 { margin: 10px 0 6px; font-family: var(--font-display); font-size: 0.95rem; }
    .bubble h4:first-child { margin-top: 0; }
    .bubble strong { color: var(--text); }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
    }
    .chat-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.92rem;
      outline: none;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    .send-btn:hover { opacity: 0.88; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 640px) {
      .study-app { max-width: 100%; }
      .chat-messages { padding: 14px; }
      .msg-row { max-width: 92%; }

      /* Compact header on mobile — smaller avatar, tighter padding,
         single-line title, subtitle hidden (it repeats what the
         empty-state already says, so no info is lost). */
      .study-header {
        padding: 10px 14px;
        gap: 10px;
      }
      .study-avatar {
        width: 34px; height: 34px;
        font-size: 1.05rem;
      }
      .study-title h1 { font-size: 0.98rem; }
      .study-title span { display: none; }
      .back-link {
        font-size: 0; /* hide text, icon-only */
        padding: 8px;
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
      }
      .back-link::before {
        content: "←";
        font-size: 1rem;
      }

      .subject-bar { padding: 8px 14px; }
      .subject-dropdown { max-width: 100%; width: 100%; }
    }
  </style>
</head>

<body>
  <div class="study-app">

    <header class="study-header">
      <div class="study-avatar">📚</div>
      <div class="study-title">
        <h1>Study Assistant</h1>
        <span>Ask questions from your teacher's uploaded notes</span>
      </div>
      <a href="index.html" class="back-link">← Back to Chat</a>
    </header>

    <div class="subject-bar">
      <div class="subject-dropdown" id="subjectDropdown">
        <button type="button" class="subject-dropdown-btn" id="subjectDropdownBtn">
          <span class="label" id="subjectDropdownLabel">All Subjects</span>
          <span class="chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>
        <div class="subject-dropdown-menu" id="subjectDropdownMenu">
          <div class="subject-option selected" data-subject="">
            <span>All Subjects</span>
            <span class="check">✓</span>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <div class="icon">📖</div>
        <h3>Ask me anything from your notes</h3>
        <p>Pick a subject above (optional) and ask a question — I'll only answer from what your teacher has uploaded.</p>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" id="chatInput" class="chat-input" placeholder="Apna sawaal yahan likhein..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>

  <script src="auth/auth.js"></script>
  <script>
    const chatMessages = document.getElementById("chatMessages");
    const emptyState = document.getElementById("emptyState");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const subjectDropdown = document.getElementById("subjectDropdown");
    const subjectDropdownBtn = document.getElementById("subjectDropdownBtn");
    const subjectDropdownLabel = document.getElementById("subjectDropdownLabel");
    const subjectDropdownMenu = document.getElementById("subjectDropdownMenu");

    let selectedSubject = "";
    // Tracks the conversation so follow-ups like "more detailed" or
    // "what about the second one" resolve against the right topic —
    // same idea as the main chatbot's history handling.
    let conversationHistory = [];

    async function loadSubjects() {
      try {
        const res = await CampusAuth.userFetch("/study/subjects");
        const data = await res.json();
        (data.subjects || []).forEach((subject) => {
          const opt = document.createElement("div");
          opt.className = "subject-option";
          opt.dataset.subject = subject;
          opt.innerHTML = `<span>${subject}</span><span class="check">✓</span>`;
          opt.addEventListener("click", () => selectSubject(subject, opt));
          subjectDropdownMenu.appendChild(opt);
        });
      } catch (err) {
        console.error("Failed to load subjects:", err);
      }
    }

    function selectSubject(subject, optEl) {
      selectedSubject = subject;
      conversationHistory = []; // fresh topic — old context shouldn't leak in
      subjectDropdownLabel.textContent = optEl.querySelector("span").textContent;
      document.querySelectorAll(".subject-option").forEach((o) => o.classList.remove("selected"));
      optEl.classList.add("selected");
      closeDropdown();
    }

    document.querySelector('.subject-option[data-subject=""]').addEventListener("click", function () {
      selectSubject("", this);
    });

    function openDropdown() { subjectDropdown.classList.add("open"); }
    function closeDropdown() { subjectDropdown.classList.remove("open"); }

    subjectDropdownBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      subjectDropdown.classList.contains("open") ? closeDropdown() : openDropdown();
    });

    document.addEventListener("click", (e) => {
      if (!subjectDropdown.contains(e.target)) closeDropdown();
    });

    function formatBotText(text) {
      // Minimal markdown → HTML: **bold**, - / * bullets, blank-line
      // paragraphs. Keeps things safe by escaping HTML first.
      const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const lines = escapeHtml(text).split("\n");
      let html = "";
      let inList = false;

      for (const line of lines) {
        const trimmed = line.trim();
        const isBullet = /^[-*]\s+/.test(trimmed);

        if (isBullet) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${trimmed.replace(/^[-*]\s+/, "")}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (trimmed === "") {
            html += "<br>";
          } else {
            html += `<p>${trimmed}</p>`;
          }
        }
      }
      if (inList) html += "</ul>";

      // **bold** and ### headings (basic)
      html = html
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^<p>###\s+(.+?)<\/p>$/gm, "<h4>$1</h4>");

      return html;
    }

    function appendUserMessage(text) {
      emptyState.remove();
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `
        <div class="msg-avatar">🧑</div>
        <div class="bubble"></div>
      `;
      row.querySelector(".bubble").textContent = text;
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return row;
    }

    function appendBotTyping() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="msg-avatar">📚</div>
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return row;
    }

    function renderBotReply(row, data) {
      const bubble = row.querySelector(".bubble");
      bubble.classList.remove("no-match");
      bubble.innerHTML = formatBotText(data.reply || "Something went wrong.");

      if (data.matched === false) {
        bubble.classList.add("no-match");
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      chatInput.value = "";
      sendBtn.disabled = true;

      appendUserMessage(message);
      conversationHistory.push({ role: "user", text: message });
      const typingRow = appendBotTyping();

      try {
        const res = await CampusAuth.userFetch("/study/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            subject: selectedSubject || undefined,
            history: conversationHistory,
          }),
        });

        if (res.status === 401) {
          renderBotReply(typingRow, { reply: "Please log in to use the Study section.", matched: false });
          return;
        }

        const data = await res.json();
        renderBotReply(typingRow, data);
        conversationHistory.push({ role: "bot", text: data.reply || "" });
      } catch (err) {
        renderBotReply(typingRow, { reply: "Server se connect nahi ho pa raha.", matched: false });
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    loadSubjects();
  </script>
</body>

</html>
